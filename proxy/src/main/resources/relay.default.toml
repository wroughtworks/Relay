# Relay proxy configuration.
#
# Generated on first start. This file is the single source of truth for proxy
# settings -- nothing here is duplicated in the database, so it stays git-able.
#
# TOML note: every key below a [table] header belongs to that table. All the
# top-level settings therefore come first, and the tables come last. Adding a
# plain setting at the bottom of this file will not do what you want.


# ----------------------------------------------------------------- network

# Where players connect. Use 0.0.0.0 to accept from anywhere.
bind = "0.0.0.0:25565"

# Server list entry. MiniMessage formatting: <red>, <bold>, <gradient:#a:#b>,
# \n for a second line. See https://docs.advntr.dev/minimessage/format.html
motd = "<gradient:#5e81ac:#88c0d0><bold>Relay</bold></gradient>\n<gray>A custom Minecraft proxy"

max-players = 100

# Whether the server list shows the real player count and a name sample.
show-online-count = true

# Authenticate players against Mojang. Leave this true unless you have a
# specific reason not to -- with it false, anyone can log in as anyone.
online-mode = true

# The brand shown in the player's F3 debug screen.
brand = "Relay"


# ----------------------------------------------------------------- forwarding
#
# How backends learn who a player is.
#
#   modern  Velocity-style, HMAC signed. Backends must set the same secret.
#           On Paper: config/paper-global.yml -> proxies.velocity.enabled: true
#   legacy  BungeeCord-style. No signature at all -- only safe when backend
#           ports are unreachable from outside your network.
#   none    No forwarding. Local testing only.
#
# In every mode, each backend needs online-mode=false in its server.properties:
# the proxy has already authenticated the player.

forwarding-mode = "modern"

# Must match the secret on every backend. Generated fresh for this install.
forwarding-secret = "CHANGE-ME"

# Alternatively, keep it out of this file. Path is relative to this config.
# forwarding-secret-file = "forwarding.secret"


# ----------------------------------------------------------------- routing

# Where players land on join, in order. Each is tried until one accepts.
try = ["lobby", "survival"]


# ----------------------------------------------------------------- tuning

# Packets at or above this many bytes are compressed. -1 disables compression.
#
# This governs the PLAYER connection only. Each backend dictates compression on its
# own link via the Set Compression packet it sends during login, so turning this
# off does not turn it off between Relay and a backend -- change
# network-compression-threshold in that server's server.properties for that.
compression-threshold = 256

# zlib level: -1 for the library default, 0 none, 9 slowest and smallest.
compression-level = -1

# How long to wait for a backend TCP connection, in milliseconds.
connect-timeout = 5000

# Drop a connection that sends nothing for this long, in milliseconds.
read-timeout = 30000

# Let Relay claim /server, /glist, /find and /send before backends see them.
# Turn off to pass every command through untouched.
intercept-commands = true


# ----------------------------------------------------------------- proxy protocol
#
# The HAProxy PROXY header prefixes a TCP connection with the address of the client
# that originally opened it, so the far end can see past the proxy in between.

# Send a PROXY header to each backend. Turn this on if your backends run with
# proxies.proxy-protocol: true in paper-global.yml -- such a backend reads nothing
# at all until the header arrives, so a mismatch here looks like a server that
# accepts the connection and then never answers.
proxy-protocol-send = false

# ------------------------------------------------------------ backend failure
#
# When a backend a player is on goes away -- a crash, a restart, a kick from the
# server itself -- move that player to the next server in the "try" list below
# instead of ending their session.
#
# This is the difference between restarting a server being routine and it being
# an outage. With it off, everyone on that backend is returned to the multiplayer
# menu; with it on, they land in the lobby and can walk back when it returns.
#
# Relay gives up after three moves in under thirty seconds, so two backends that
# both accept players and immediately drop them cannot bounce someone forever.
fallback-on-backend-loss = true


# ----------------------------------------------------------------- client api
#
# Lets a client-side mod talk to the proxy over the "relay:api_v1" plugin channel:
# a live server list, switch requests with progress, and whatever is added later.
#
# Vanilla clients are unaffected -- the conversation only starts if a client sends
# a hello, and Relay never sends unsolicited. Requests are permission-checked
# against the same nodes as the in-game commands and rate limited, so a modded
# client gains nothing it could not do by typing /server.
#
# See docs/client-api.md for the wire format.
client-api = true


# ----------------------------------------------------------------- backend api
#
# Lets a plugin on a backend server talk to the proxy over plugin messages, the
# way BungeeCord has always worked: move players between servers, ask who is
# online where, send cross-server messages, and relay custom payloads.
#
# Wire-compatible with BungeeCord's "bungeecord:main" channel, so a plugin
# written for BungeeCord or Velocity works unchanged. Relay's own "relay:main"
# channel is accepted too.
#
# Backends are trusted: unlike the client API, these requests are not permission
# checked, because a backend already holds the forwarding secret. Keep backend
# ports unreachable from outside your network.
backend-api = true

# ----------------------------------------------------------------- diagnostics

# Record what closes each connection, with a stack trace naming the code that did
# it. On by default: it costs one handler per connection and logs only when a
# connection ends, and the alternative is a close that leaves no trace of who
# caused it -- exactly the situation where it is needed and too late to enable.
# The detail appears at DEBUG; failed writes and pipeline faults warn regardless.
trace-closes = true


# Read a PROXY header from incoming connections. Only for when something sits in
# front of Relay, such as HAProxy or a load balancer.
#
# Security: this trusts the header completely. Anything that can open a connection
# to the listener can claim any source address, defeating per-IP bans and logging.
# Enable it only when the bind port is reachable solely by that upstream proxy.
proxy-protocol-receive = false


# ------------------------------------------------------------------- groups
#
# Several interchangeable backends under one name. Players type "/server
# survival" and land on whichever member is the better host right now; naming a
# member directly still works, which is how someone rejoins the server their
# base is on.
#
# Usually there is nothing to write here. Backends numbered with a dash or an
# underscore group themselves: survival-01 and survival-02 are already a group
# called "survival". Only a separator followed by digits counts, so a name like
# "pvp-arena" stays one server.
#
# A group is a destination anywhere a backend is: "try" above, forced hosts
# below, /send, and both plugin-message APIs. Losing a member is the point --
# a player whose server dies is handed to a sibling before Relay looks any
# further down "try".
#
# Write a group out only to say something the naming does not: an odd set, or
# members that are not numbered. An explicit entry wins over the derived one,
# and a real backend's name always wins over a group.
#
# [groups]
# hub = ["lobby", "spawn"]


# How a group picks. The choice only ever orders the members -- the preferred
# one is tried first and the rest catch its failures -- so balancing and
# failover are the same mechanism rather than two that have to agree.
#
#   least-players    fewest players first. Fills an empty server before a busy
#                    one, and self-corrects as people come and go.
#   round-robin      each join takes the next member in turn. Better when
#                    players arrive in waves and player counts lag the truth.
#   random           cheap, stateless, even enough over any real number of joins.
#   first-available  configured order, always. Not balancing: later members
#                    exist only to catch failures of earlier ones.
#
# Ties keep configured order in every strategy. This must stay above the first
# [table] header: TOML reads a bare key after one as belonging to that table,
# and it would silently become servers.balance instead.
balance = "least-players"


# ------------------------------------------------------------------- health
#
# Relay pings each backend on an interval -- the same server-list ping a client
# makes -- so it knows a server is down before a player does. Without it, a dead
# backend is discovered by sending someone to it: they wait out the connect
# timeout, get an error, and the next player repeats the whole thing.
#
# A backend that fails checks is moved to the back of its group rather than
# removed, so a network whose health checking is itself broken degrades to
# trying anyway instead of refusing every join.
#
# failures-before-down is hysteresis: one dropped packet or one long GC pause
# will fail a single check against a perfectly healthy server, and reacting to
# that would empty it. Recovery is immediate in the other direction.

[health]
enabled = true
interval = 10000
timeout = 3000
failures-before-down = 3


# ---------------------------------------------------------------- dashboard
#
# A read-only HTTP API and a WebSocket carrying live events, for the web
# dashboard. Nothing it serves can change anything: no request moves a player,
# closes a connection, or edits config.
#
#   GET  /api/overview   players, uptime, backend and group counts
#   GET  /api/servers    each backend, its address, players, and group
#   GET  /api/groups     each group, its members, and its total
#   GET  /api/players    who is online and where
#   WS   /api/events     one socket, every event type
#
# Off by default, and bound to loopback when on. It says who is online and
# which server they are on, and it has no authentication yet -- that arrives
# with the half of the dashboard that can act. Until then, reach it over an SSH
# tunnel rather than binding it to a public address; Relay warns at startup if
# you do.

[dashboard]
enabled = false
bind = "127.0.0.1:8080"


# ----------------------------------------------------------------- backends

[servers]
lobby = "127.0.0.1:25566"
survival = "127.0.0.1:25567"
# Geyser runs as an ordinary backend; Relay does not speak Bedrock itself.
# bedrock = "127.0.0.1:25568"


# ----------------------------------------------------------------- forced hosts
#
# Send players straight to a backend based on the hostname they connected to,
# bypassing the "try" order above.

# [forced-hosts]
# "survival.example.com" = ["survival"]


# ----------------------------------------------------------------- permissions
#
# Nodes are shared between in-game commands and (later) the dashboard, so a role
# defined here means the same thing in both places. "relay.*" matches any node
# beginning "relay."; "*" matches everything.

[permissions]
default = ["relay.command.server", "relay.command.glist"]
# Grant by username or by UUID:
# "yourname" = ["relay.*"]
# "00000000-0000-0000-0000-000000000000" = ["relay.command.send"]


# ----------------------------------------------------------------- protocol
#
# Escape hatch for Minecraft updates. Play-state packet ids shift whenever
# Mojang inserts a packet, and Relay depends on a handful of them. If a version
# lands before a Relay release does, correct the id here instead of waiting for
# a build.
#
# Key format:  "state.direction.packet.protocolVersion" = id
# Packets:     play.serverbound -> chat_command, configuration_acknowledged
#              play.clientbound -> disconnect, system_chat, start_configuration

# [protocol.overrides]
# "play.clientbound.start_configuration.772" = 0x71
