name: RelayDebug
version: '${version}'
main: dev.relay.debug.RelayDebugPlugin
api-version: '1.20'
author: Relay
description: Reports why player connections close, including the ones Paper closes silently.
load: POSTWORLD

commands:
  relaytest:
    description: Drive the proxy's backend API by hand.
    usage: /relaytest [probe|connect <server>|forward <text>]
    permission: relaydebug.test
