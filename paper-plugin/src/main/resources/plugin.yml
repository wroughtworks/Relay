name: Relay
version: '${version}'
main: dev.relay.paper.RelayPlugin
api-version: '1.20'
author: Relay
description: The backend-side companion to the Relay proxy.
load: POSTWORLD

commands:
  relay:
    description: Talk to the proxy over the backend API.
    usage: /relay [probe|connect <server>|forward <text>]
    permission: relay.admin
    aliases: [relayproxy]

permissions:
  relay.admin:
    description: Use /relay.
    default: op
