# Relay --- the backend-side companion to the Relay proxy.
#
# Exposes the proxy's backend API to this server, and reports why player
# connections close. Paper logs pipeline faults at DEBUG and says nothing at all
# when a channel is closed before its exception handler runs, which is why a
# connection can otherwise disappear with no recorded reason.

# Log every packet in and out, by class name.
#
# Extremely verbose --- thousands of lines per second per player --- and only
# useful for a short, targeted session. Leave this off unless you are watching a
# specific join fail.
log-packets: false

# Run the read-only backend API checks automatically when a player joins, and
# print what came back. Read-only: nothing here moves a player or changes state.
probe-on-join: true

# How often to report this server's own load to the proxy --- TPS, MSPT, heap
# and CPU --- so the dashboard can show them. 0 disables it.
#
# The proxy cannot measure these from outside: a server deep in a GC spiral
# answers status pings perfectly well. It also cannot ask for them, because a
# plugin message needs a player connection to travel on, so this is a push.
#
# The same limitation means an empty server reports nothing. Its last figures
# stop being replaced rather than going to zero, and the proxy stamps each
# report with the time it arrived so a quiet server is not mistaken for a
# frozen one.
stats-interval-seconds: 5
